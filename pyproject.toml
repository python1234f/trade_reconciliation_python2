[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trade-reconciliation"
version = "1.0.0"
description = "Offline-first, deterministic trade execution reconciliation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
llm = ["openai>=1.80,<3"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/trade_reconciliation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
